services:
  - type: worker
    name: odobli-ai-telegram-bot
    env: python
    buildCommand: pip install -r bot/requirements.txt
    startCommand: python bot/main.py
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: SUBSCRIPTION_PRICE_SOM
        value: "25000"
      - key: CARD_NUMBER
        value: "8600 0000 0000 0000"
